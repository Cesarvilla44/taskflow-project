<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Task Manager</title>
    <link rel="stylesheet" href="output.css">
    <style>
        /* Tarjetas de tareas: estilo consistente con el resto de la UI */
        .task-card {
            border-radius: 0.75rem;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background-color: #f8fafc;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        body.dark .task-card {
            background-color: rgba(15, 23, 42, 0.7);
            border-color: rgba(51, 65, 85, 0.9);
        }

        .task-card + .task-card {
            margin-top: 0.5rem;
        }

        .task-content .task-title {
            font-size: 0.95rem;
        }

        .task-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .task-actions button {
            font-size: 0.8rem;
            border-radius: 999px; /* pill como el botón Añadir */
            padding: 0.45rem 0.9rem;
            border: none;
            cursor: pointer;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .task-actions button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .task-actions button:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
        }

        .task-actions .edit-btn {
            background: linear-gradient(135deg, #f97316, #fb923c);
        }

        .task-actions .delete-btn {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        .task-actions .save-btn {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .task-actions .cancel-btn {
            background: linear-gradient(135deg, #64748b, #94a3b8);
        }

        .task-title.task-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .bulk-actions {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        .bulk-actions button {
            border-radius: 999px;
            padding: 0.55rem 1rem;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .bulk-complete-btn {
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
        }

        .bulk-delete-btn {
            background: linear-gradient(135deg, #dc2626, #7f1d1d);
        }
    </style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-500 min-h-screen">

    <header class="p-5 flex justify-between items-center border-b bg-white dark:bg-slate-800 dark:border-slate-700 shadow-sm">
        <h1 class="text-3xl font-extrabold text-blue-600 dark:text-blue-400">Flujo de Tareas</h1>
        
        <button id="theme-toggle" class="px-5 py-2 rounded-full bg-slate-800 text-white dark:bg-white dark:text-slate-900 font-bold shadow-md hover:scale-105 transition-all active:scale-95">
            <span id="theme-icon" class="mr-2 text-white">🌙</span>
            <span id="theme-label">oscuro</span>
        </button>
    </header>

    <main class="flex">
        <aside class="w-64 min-h-screen p-6 border-r bg-slate-50 dark:bg-slate-800 dark:border-slate-700 hidden md:block">
            <h2 class="text-xl font-bold mb-6">Categorías</h2>
            <ul class="space-y-4">
                <li class="flex items-center gap-2 cursor-pointer hover:text-blue-500 transition"><span>📁</span> Trabajo</li>
                <li class="flex items-center gap-2 cursor-pointer hover:text-blue-500 transition"><span>📚</span> Estudio</li>
                <li class="flex items-center gap-2 cursor-pointer hover:text-blue-500 transition"><span>👤</span> Personal</li>
            </ul>
        </aside>

        <section class="flex-1 p-8 max-w-4xl mx-auto">
            
            <form id="task-form" class="mb-10">
                <div class="flex gap-3 bg-slate-100 dark:bg-slate-800 p-2 rounded-xl border dark:border-slate-700 shadow-inner">
                    <input type="text" id="task-input" placeholder="¿Qué hay que hacer hoy?" required 
                           class="flex-1 p-3 bg-transparent focus:outline-none dark:text-white">
                    <button type="submit" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold transition-all shadow-lg shadow-blue-500/30">
                        Añadir
                    </button>
                </div>
            </form>

            <div class="space-y-6">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Buscar tareas..." 
                           class="w-full p-4 rounded-xl border bg-white dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <label class="text-sm font-semibold">
                        Categoría
                        <select id="category-filter" class="mt-1 w-full p-3 rounded-xl border bg-white dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all">Todas</option>
                            <option value="General">General</option>
                            <option value="Trabajo">Trabajo</option>
                            <option value="Estudio">Estudio</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </label>

                    <label class="text-sm font-semibold">
                        Prioridad
                        <select id="priority-filter" class="mt-1 w-full p-3 rounded-xl border bg-white dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all">Todas</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                        </select>
                    </label>

                    <label class="text-sm font-semibold">
                        Ordenar
                        <select id="sort-select" class="mt-1 w-full p-3 rounded-xl border bg-white dark:bg-slate-800 dark:border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="newest">Más recientes</option>
                            <option value="oldest">Más antiguas</option>
                            <option value="az">A → Z</option>
                            <option value="za">Z → A</option>
                        </select>
                    </label>
                </div>
                
                <div id="tasks-container" class="space-y-3">
                    <div class="p-4 border rounded-lg dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-slate-400 italic">
                        No hay tareas por ahora.
                    </div>
                </div>

                <div class="bulk-actions">
                    <button id="complete-all-btn" class="bulk-complete-btn">🚀 Completar todas las tareas</button>
                    <button id="delete-all-btn" class="bulk-delete-btn">🗑️ Eliminar todas las tareas</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
